name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    # Refresh the hearing schedule hourly, 8am-8pm Eastern on weekdays (UTC times).
    - cron: "17 12-23,0 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      SENATE_SIM_CONTACT: ${{ github.repository }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: ${{ env.CONGRESS_API_KEY != '' }}
        with:
          python-version: "3.12"
          cache: pip
      - name: Refresh hearing schedule
        if: ${{ env.CONGRESS_API_KEY != '' }}
        working-directory: .
        run: |
          pip install -r requirements.txt
          python scripts/fetch_hearings.py || echo "::warning::Hearing fetch failed; deploying the last committed schedule"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
